name: Harvis 1.0.1 hotfix package

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build and test Windows packages
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\build\build_installer.ps1 -Version "1.0.1"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harvis-Setup-1.0.1-Windows-x64
          path: dist/installer/Harvis-Setup-1.0.1-Windows-x64.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harvis-1.0.1-Windows-x64-portable
          path: dist/Harvis-1.0.1-Windows-x64-portable.zip
          if-no-files-found: error
